# Product Catalog - Deployment + Service
# Reads products from MySQL; optional Redis read-through cache.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: ecommerce
  labels: { app: product-catalog, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-catalog }
  template:
    metadata:
      labels: { app: product-catalog, tier: backend }
    spec:
      containers:
        - name: product-catalog
          image: swr.example.com/ecommerce/product-catalog:1.0.0   # TODO: your SWR path
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: ecommerce-config }
            - secretRef: { name: ecommerce-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: ecommerce
spec:
  selector: { app: product-catalog }
  ports:
    - port: 3001
      targetPort: 3001
---
