# Order Management - Deployment + Service (Spring Boot, port 9090)
# Orchestrates carts/purchases; persists carts in MySQL; health via actuator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management
  namespace: ecommerce
  labels: { app: order-management, tier: backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-management }
  template:
    metadata:
      labels: { app: order-management, tier: backend }
    spec:
      containers:
        - name: order-management
          image: swr.example.com/ecommerce/order-management:1.0.0   # TODO: your SWR path
          ports: [{ containerPort: 9090 }]
          envFrom:
            - configMapRef: { name: ecommerce-config }
            - secretRef: { name: ecommerce-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 9090 }
            initialDelaySeconds: 40      # Spring Boot needs longer to boot
            periodSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /actuator/health, port: 9090 }
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: order-management
  namespace: ecommerce
spec:
  selector: { app: order-management }
  ports:
    - port: 9090
      targetPort: 9090
