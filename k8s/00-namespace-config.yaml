apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
# Non-secret configuration (guide §5.1: "Use ConfigMaps and Secrets for configuration")
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  DB_HOST: "rds-your-instance.pardis-cloud.internal"   # TODO: your RDS endpoint
  DB_PORT: "3306"
  DB_NAME: "ecommerce"
  REDIS_URL: "redis://dcs-your-instance.pardis-cloud.internal:6379"  # TODO: your DCS endpoint
  REDIS_TTL_SECONDS: "300"
  PRODUCT_CATALOG_API_HOST: "http://product-catalog"
  PRODUCT_INVENTORY_API_HOST: "http://product-inventory"
  SHIPPING_HANDLING_API_HOST: "http://shipping-and-handling"
  REACT_APP_PROFILE_API_HOST: "http://profile-management"
  REACT_APP_PRODUCT_API_HOST: "http://product-catalog"
  REACT_APP_INVENTORY_API_HOST: "http://product-inventory"
  REACT_APP_ORDER_API_HOST: "http://order-management"
  REACT_APP_SHIPPING_API_HOST: "http://shipping-and-handling"
  REACT_APP_CONTACT_API_HOST: "http://contact-support-team"
  CORS_ORIGINS: "https://shop.example.com"             # TODO: your public domain
---
# Sensitive values (guide §8.1/§13.1) - create real Secret via kubectl create secret
# or your secret manager; do NOT commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  DB_USER: "ecommerce_user"
  DB_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_LONG_RANDOM"
  MYSQL_ROOT_PASSWORD: "REPLACE_ME"
