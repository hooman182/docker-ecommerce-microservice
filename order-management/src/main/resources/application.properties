spring.application.name=order-management
server.port=9090
server.address=0.0.0.0
PRODUCT_INVENTORY_API_HOST=http://localhost
PRODUCT_CATALOG_API_HOST=http://localhost
SHIPPING_HANDLING_API_HOST=http://localhost

# MySQL (RDS in prod, compose in dev) - overridden via env vars
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USER:ecommerce_user}
spring.datasource.password=${DB_PASSWORD:ecommerce_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (guide 6.1: use connection pooling in application)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
# Do not fail boot if MySQL is briefly unreachable (pod starts before RDS ready)
spring.datasource.hikari.initialization-fail-timeout=-1

# Actuator health endpoint (K8s liveness/readiness, ELB health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# JPA: schema comes from db/init.sql; never auto-ddl in prod
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect